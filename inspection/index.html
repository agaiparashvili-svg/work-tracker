<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ცხელი წყალი / გაგრილების შემოწმება</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700;800&display=swap');

  :root {
    --bg:#ffffff; --surface:#f8fafc; --surface2:#f1f5f9; --surface3:#e2e8f0;
    --border:#cbd5e1; --border2:#94a3b8;
    --accent:#0284c7; --accent-dim:rgba(2,132,199,.1);
    --accent2:#4f46e5; --accent2-dim:rgba(79,70,229,.1);
    --warn:#d97706; --warn-dim:rgba(217,119,6,.1);
    --danger:#dc2626; --danger-dim:rgba(220,38,38,.1);
    --good:#059669; --good-dim:rgba(5,150,105,.1);
    --purple:#7c3aed; --sky:#0284c7;
    --text:#0f172a; --text2:#475569; --text3:#94a3b8;
    --radius:10px; --radius-lg:14px; --radius-xl:20px;
    --shadow:0 8px 32px rgba(0,0,0,.12);
    --font-body:'Noto Sans Georgian',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;}

  /* ── LOADING ── */
  #loading-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:999;}
  .spinner{width:42px;height:42px;border:4px solid var(--surface3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── AUTH ── */
  #auth-screen{display:none;align-items:center;justify-content:center;min-height:100vh;padding:20px;
    background:radial-gradient(ellipse 60% 50% at 15% 15%,rgba(2,132,199,.06) 0%,transparent 100%),
      radial-gradient(ellipse 50% 40% at 85% 85%,rgba(5,150,105,.05) 0%,transparent 100%),var(--bg);}
  .auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:44px;width:100%;max-width:420px;box-shadow:var(--shadow);}
  .auth-logo{text-align:center;margin-bottom:32px;}
  .auth-logo .icon{width:58px;height:58px;background:linear-gradient(145deg,#38bdf8,#0284c7);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:26px;box-shadow:0 8px 28px rgba(2,132,199,.28);}
  .auth-logo h1{font-size:20px;font-weight:800;letter-spacing:-.4px;color:var(--text);}
  .auth-logo p{color:var(--text3);font-size:13px;margin-top:6px;line-height:1.5;}
  .tabs{display:flex;background:var(--surface2);border-radius:var(--radius);padding:3px;margin-bottom:26px;border:1px solid var(--border);}
  .tab{flex:1;padding:9px;text-align:center;border-radius:8px;cursor:pointer;color:var(--text3);font-size:13px;font-weight:700;transition:all .22s;}
  .tab.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08);}

  /* ── FORMS ── */
  .form-group{margin-bottom:18px;}
  label{display:block;font-size:11px;color:var(--text2);margin-bottom:7px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
  input,select,textarea{width:100%;padding:11px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:inherit;font-size:14px;transition:all .2s;-webkit-appearance:none;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2);background:var(--surface);box-shadow:0 0 0 3px rgba(79,70,229,.1);}
  textarea{resize:vertical;min-height:70px;line-height:1.6;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:560px){.form-row{grid-template-columns:1fr;}}

  /* ── CHIPS ── */
  .chip-group{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:flex;align-items:center;gap:6px;padding:9px 16px;border-radius:24px;border:1.5px solid var(--border);background:var(--surface2);cursor:pointer;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s;user-select:none;}
  .chip:hover{border-color:var(--border2);color:var(--text2);}
  .chip.sel-green{border-color:var(--good);background:var(--good-dim);color:#047857;}
  .chip.sel-red{border-color:var(--danger);background:var(--danger-dim);color:#b91c1c;}
  .chip.sel-yellow{border-color:var(--warn);background:var(--warn-dim);color:#b45309;}
  .chip input{display:none;}

  /* ── BUTTONS ── */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 20px;border:none;border-radius:var(--radius);cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;transition:all .2s;}
  .btn-primary{background:linear-gradient(135deg,#38bdf8,#0284c7);color:white;box-shadow:0 4px 16px rgba(2,132,199,.26);}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(2,132,199,.36);}
  .btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface2);color:var(--text);border-color:var(--border2);}
  .btn-sm{padding:6px 12px;font-size:12px;}
  .btn-full{width:100%;}
  .error-msg{color:#dc2626;font-size:12px;margin-top:8px;}
  .success-msg{color:#047857;font-size:12px;margin-top:8px;}

  /* ── TOPBAR ── */
  #app{display:none;flex-direction:column;min-height:100vh;}
  .topbar{background:rgba(248,250,252,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);box-shadow:0 1px 8px rgba(0,0,0,.06);padding:0 18px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .topbar-logo{font-size:14px;font-weight:800;letter-spacing:-.4px;color:var(--text);display:flex;align-items:center;gap:8px;}
  .topbar-logo span{background:linear-gradient(135deg,#0284c7,#059669);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  .topbar-right{display:flex;align-items:center;gap:8px;}
  .role-badge{padding:3px 9px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;}
  .role-admin{background:rgba(220,38,38,.1);color:#dc2626;border:1px solid rgba(220,38,38,.25);}
  .role-supervisor{background:rgba(217,119,6,.1);color:#b45309;border:1px solid rgba(217,119,6,.25);}
  .role-worker{background:rgba(5,150,105,.1);color:#065f46;border:1px solid rgba(5,150,105,.25);}
  .role-nightwatch{background:rgba(124,58,237,.1);color:#5b21b6;border:1px solid rgba(124,58,237,.25);}
  .role-pending{background:rgba(100,116,139,.1);color:#475569;border:1px solid rgba(100,116,139,.2);}
  .user-info{color:var(--text2);font-size:13px;font-weight:600;}
  @media(max-width:520px){.user-info{display:none;}}

  /* ── NAV ── */
  .nav{background:rgba(241,245,249,.95);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 10px;scrollbar-width:none;}
  .nav::-webkit-scrollbar{display:none;}
  .nav-item{padding:13px 15px;cursor:pointer;color:var(--text3);white-space:nowrap;font-size:13px;border-bottom:2px solid transparent;transition:all .2s;font-weight:700;}
  .nav-item.active{color:var(--accent);border-color:var(--accent);}
  .nav-item:hover{color:var(--text2);}

  /* ── CONTENT ── */
  .content{padding:22px 16px;max-width:920px;margin:0 auto;width:100%;}
  .section{display:none;}.section.active{display:block;animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .section-header h2{font-size:19px;font-weight:800;letter-spacing:-.5px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:14px;}
  .filter-row{display:flex;gap:8px;flex-wrap:wrap;}
  .filter-row select,.filter-row input{width:auto;font-size:12px;padding:7px 11px;}

  /* ── OBJECT GRID ── */
  .obj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:6px;}
  .obj-btn{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:16px 14px;cursor:pointer;text-align:left;transition:all .2s;display:flex;flex-direction:column;gap:6px;font-family:inherit;}
  .obj-btn:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 6px 22px rgba(2,132,199,.14);}
  .obj-btn .obj-name{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.3px;}
  .obj-btn .obj-tags{display:flex;gap:5px;flex-wrap:wrap;}
  .obj-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
  .obj-tag.cool{background:var(--accent2-dim);color:#4338ca;}
  .obj-tag.water{background:var(--accent-dim);color:#0369a1;}
  .obj-btn .obj-last{font-size:11px;color:var(--text3);font-weight:600;}

  /* ── SYSTEM BLOCKS ── */
  .sys-block{border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:16px;background:var(--surface);}
  .sys-block.cool{border-left:4px solid var(--accent2);}
  .sys-block.water{border-left:4px solid var(--sky);}
  .sys-block.photo{border-left:4px solid var(--purple);}
  .sys-title{font-size:15px;font-weight:800;letter-spacing:-.3px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
  .ins-back{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:700;margin-bottom:14px;background:none;border:none;font-family:inherit;}
  .ins-back:hover{color:var(--accent);}

  /* ── FILES ── */
  .file-area{border:2px dashed var(--border);border-radius:var(--radius-lg);padding:24px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface2);}
  .file-area:hover,.file-area.over{border-color:var(--accent2);background:rgba(79,70,229,.04);}
  .file-area p{color:var(--text2);font-size:13px;margin-top:8px;}
  .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin-top:12px;}
  .preview-item{position:relative;border-radius:10px;overflow:hidden;background:var(--surface3);aspect-ratio:1;}
  .preview-item img{width:100%;height:100%;object-fit:cover;}
  .preview-item .del-img{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.75);border:none;color:white;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;}

  /* ── STATUS / DETAIL ── */
  .status{padding:3px 10px;border-radius:6px;font-size:10px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;display:inline-flex;align-items:center;gap:4px;}
  .s-good{background:rgba(5,150,105,.1);color:#047857;border:1px solid rgba(5,150,105,.3);}
  .s-warn{background:rgba(217,119,6,.1);color:#b45309;border:1px solid rgba(217,119,6,.3);}
  .s-bad{background:rgba(220,38,38,.1);color:#b91c1c;border:1px solid rgba(220,38,38,.3);}
  .detail-row{display:flex;gap:10px;margin-bottom:11px;font-size:13px;align-items:flex-start;}
  .detail-label{color:var(--text3);min-width:150px;flex-shrink:0;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding-top:1px;}
  @media(max-width:560px){.detail-label{min-width:110px;font-size:10px;}}
  .comment-block{background:var(--surface2);border-radius:10px;padding:11px 13px;margin-top:8px;font-size:13px;color:var(--text2);border-left:3px solid var(--accent2);line-height:1.6;}

  /* ── EMPTY ── */
  .empty-state{text-align:center;padding:60px 20px;color:var(--text3);}
  .empty-state .empty-icon{font-size:46px;margin-bottom:12px;opacity:.4;}
  .empty-state p{font-size:14px;font-weight:600;}

  /* ── MODAL ── */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:200;align-items:center;justify-content:center;padding:18px;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-xl);padding:26px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow);}
  .modal h3{font-size:17px;font-weight:800;margin-bottom:16px;}
  .modal-footer{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;align-items:center;}

  /* ── NOTIFICATION ── */
  #notification{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:white;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:300;opacity:0;transition:all .3s;box-shadow:0 8px 28px rgba(0,0,0,.25);max-width:90vw;text-align:center;}
  #notification.show{opacity:1;transform:translateX(-50%) translateY(0);}
  #notification.notif-success{background:#047857;}
  #notification.notif-error{background:#b91c1c;}
  #notification.notif-info{background:#1e293b;}
</style>
</head>
<body>

<div id="loading-screen"><div class="spinner"></div></div>

<!-- ══ AUTH ══ -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="icon">💧</div>
      <h1>ცხელი წყალი / გაგრილება</h1>
      <p>შემოწმების სისტემა — Lopota Resort</p>
    </div>
    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">შესვლა</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">რეგისტრაცია</div>
    </div>

    <div id="login-form">
      <div class="form-group"><label>ელ-ფოსტა</label><input type="email" id="li-email" placeholder="თქვენი ელ-ფოსტა"></div>
      <div class="form-group"><label>პაროლი</label><input type="password" id="li-pass" placeholder="••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn-primary btn-full" onclick="doLogin()">შესვლა</button>
      <div style="text-align:center;margin-top:12px"><a href="#" onclick="doReset();return false" style="color:var(--accent2);font-size:12px;text-decoration:none">პაროლი დაგავიწყდათ?</a></div>
      <div class="error-msg" id="li-err"></div>
      <div class="success-msg" id="li-ok"></div>
    </div>

    <div id="register-form" style="display:none">
      <div class="form-group"><label>სახელი და გვარი</label><input type="text" id="rg-name" placeholder="მაგ: გიორგი მაისურაძე"></div>
      <div class="form-group"><label>ელ-ფოსტა</label><input type="email" id="rg-email" placeholder="თქვენი ელ-ფოსტა"></div>
      <div class="form-group"><label>პაროლი</label><input type="password" id="rg-pass" placeholder="მინიმუმ 6 სიმბოლო"></div>
      <button class="btn btn-primary btn-full" onclick="doRegister()">რეგისტრაცია</button>
      <div class="error-msg" id="rg-err"></div>
      <div class="success-msg" id="rg-ok"></div>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-logo">💧❄️ <span>შემოწმება</span></div>
    <div class="topbar-right">
      <span class="user-info" id="ui-name"></span>
      <span class="role-badge role-pending" id="role-badge"></span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">გასვლა</button>
    </div>
  </div>
  <div class="nav" id="main-nav"></div>
  <div class="content">

    <!-- PENDING -->
    <div class="section active" id="sec-pending">
      <div style="text-align:center;padding:80px 20px">
        <div style="font-size:52px;margin-bottom:16px">⏳</div>
        <h2 style="margin-bottom:10px">მოლოდინში</h2>
        <p style="color:var(--text2);line-height:1.7">თქვენს ანგარიშს ჯერ არ მიუნიჭებია როლი.<br>ადმინი გაგიაქტიურებთ ანგარიშს.</p>
      </div>
    </div>

    <!-- SUBMIT INSPECTION -->
    <div class="section" id="sec-inspect">
      <div class="section-header"><h2>🔎 ობიექტის შემოწმება</h2></div>
      <div id="inspect-picker">
        <p style="color:var(--text2);font-size:13px;margin-bottom:14px">აირჩიეთ ობიექტი, რომელსაც ამოწმებთ</p>
        <div class="obj-grid" id="obj-grid"></div>
      </div>
      <div id="inspect-form-host" style="display:none"></div>
    </div>

    <!-- MY INSPECTIONS -->
    <div class="section" id="sec-myinspect">
      <div class="section-header">
        <h2>📋 ჩემი შემოწმებები</h2>
        <div class="filter-row"><select id="mif-obj" onchange="renderMyInspections()"><option value="all">ყველა ობიექტი</option></select></div>
      </div>
      <div id="myinspect-list"></div>
    </div>

    <!-- ALL (supervisor/admin) -->
    <div class="section" id="sec-all">
      <div class="section-header">
        <h2>🗂 ყველა შემოწმება</h2>
        <div class="filter-row">
          <select id="aif-obj" onchange="renderAllInspections()"><option value="all">ყველა ობიექტი</option></select>
          <select id="aif-wk" onchange="renderAllInspections()"><option value="all">ყველა თანამშრომელი</option></select>
          <input type="date" id="aif-date" onchange="renderAllInspections()">
          <button class="btn btn-sm btn-ghost" onclick="clearInspectFilter()">გასუფთავება</button>
          <button class="btn btn-sm btn-primary" onclick="exportInspectCSV()">📥 CSV</button>
        </div>
      </div>
      <div id="allinspect-list"></div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-ov">
  <div class="modal">
    <h3 id="m-title"></h3>
    <div id="m-body"></div>
    <div class="modal-footer" id="m-footer"></div>
  </div>
</div>

<div id="notification"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, getDoc, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

// Same Firebase project as work-tracker — shared accounts & users collection
const firebaseConfig = {
  apiKey: "AIzaSyBiKjEDDug9McKWuLr6tLusSO5Kwf5m3RE",
  authDomain: "work-tracker-7aa42.firebaseapp.com",
  projectId: "work-tracker-7aa42",
  storageBucket: "work-tracker-7aa42.firebasestorage.app",
  messagingSenderId: "639886380518",
  appId: "1:639886380518:web:f8168469540549f9859a27",
  measurementId: "G-3D4ES1PLMJ"
};
const fireApp = initializeApp(firebaseConfig);
const auth = getAuth(fireApp);
const db = getFirestore(fireApp);
const storage = getStorage(fireApp);

// ── OBJECTS ──
// type: 'both' = ცხელი წყალი + გაგრილება/ჩილერი; 'wateronly' = მხოლოდ ცხელი წყალი
const INSPECT_OBJECTS = [
  { id:'k1',  name:'პირველი კორპუსი', type:'both' },
  { id:'k23', name:'2-3 კორპუსი',      type:'both' },
  { id:'k4',  name:'4 კორპუსი',        type:'both' },
  { id:'k5',  name:'5 კორპუსი',        type:'both' },
  { id:'k6',  name:'6 კორპუსი',        type:'both' },
  { id:'k7',  name:'7 კორპუსი',        type:'both' },
  { id:'k8',  name:'8 კორპუსი',        type:'both' },

window.switchTab = function(t){
  $('tab-login').classList.toggle('active', t==='login');
  $('tab-register').classList.toggle('active', t==='register');
  $('login-form').style.display = t==='login' ? 'block' : 'none';
  $('register-form').style.display = t==='register' ? 'block' : 'none';

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    const snap = await getDoc(doc(db,'users',user.uid));
    if (snap.exists()) { currentRole = snap.data().role; $('loading-screen').style.display='none'; launchApp(snap.data()); }
    else { await signOut(auth); $('loading-screen').style.display='none'; showAuth(); }
  } else {
    currentUser=null; currentRole=null; $('loading-screen').style.display='none'; showAuth();
  }
});
function showAuth(){ $('auth-screen').style.display='flex'; $('app').style.display='none'; }
function showApp(){ $('auth-screen').style.display='none'; $('app').style.display='flex'; }

window.doRegister = async function(){
  const name=$('rg-name').value.trim(), email=$('rg-email').value.trim().toLowerCase(), pass=$('rg-pass').value;
  const err=$('rg-err'), ok=$('rg-ok'); err.textContent=''; ok.textContent='';
  if(!name||!email||!pass){ err.textContent='ყველა ველი სავალდებულოა'; return; }
  if(pass.length<6){ err.textContent='პაროლი მინიმუმ 6 სიმბოლო'; return; }
  try {
    const cred = await createUserWithEmailAndPassword(auth,email,pass);
    await setDoc(doc(db,'users',cred.user.uid), { uid:cred.user.uid, name, email, role:'pending', createdAt:serverTimestamp() });
    await signOut(auth);
    ok.textContent='✓ დარეგისტრირდით! ადმინი მიგანიჭებთ როლს, შემდეგ შეძლებთ შესვლას.';
    ['rg-name','rg-email','rg-pass'].forEach(id=>$(id).value='');
  } catch(ex){
    err.textContent = ex.code==='auth/email-already-in-use' ? 'ეს ელ-ფოსტა უკვე რეგისტრირებულია' : ex.message;
  }
};

window.doLogin = async function(){

function launchApp(userData){
  showApp();
  $('ui-name').textContent = userData.displayName || userData.name || '';
  const rl={admin:'ადმინი',supervisor:'სუპერვაიზერი',worker:'შემსრულებელი',nightwatch:'ღამის მორიგე',pending:'მოლოდინში'};
  const rc={admin:'role-admin',supervisor:'role-supervisor',worker:'role-worker',nightwatch:'role-nightwatch',pending:'role-pending'};
  const b=$('role-badge'); b.textContent=rl[userData.role]||userData.role; b.className='role-badge '+(rc[userData.role]||'role-pending');
  buildNav(userData.role);
}

function buildNav(role){
  const nav=$('main-nav'); nav.innerHTML='';
  const map={
    worker:    [['sec-inspect','🔎 შემოწმება'],['sec-myinspect','📋 ჩემი']],
    nightwatch:[['sec-inspect','🔎 შემოწმება'],['sec-myinspect','📋 ჩემი']],
    supervisor:[['sec-inspect','🔎 შემოწმება'],['sec-myinspect','📋 ჩემი'],['sec-all','🗂 ყველა']],
    admin:     [['sec-all','🗂 ყველა შემოწმება'],['sec-inspect','🔎 შემოწმება']]
  };
  const items=map[role]||[];
  if(!items.length){ showSection('sec-pending'); return; }
  items.forEach(([id,label],i)=>{
    const el=document.createElement('div');
    el.className='nav-item'+(i===0?' active':''); el.textContent=label; el.dataset.sid=id;
    el.onclick=()=>activateSection(id,el);
    nav.appendChild(el);
  });
  showSection(items[0][0]);
  // listeners
  if(role==='worker'||role==='nightwatch'||role==='supervisor') listenMyInspections();
  if(role==='supervisor'||role==='admin') listenAllInspections();
  if(items[0][0]==='sec-inspect') resetInspectPicker();
  if(items[0][0]==='sec-all') renderAllInspections();
}

function activateSection(id,el){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active'); showSection(id);
  if(id==='sec-inspect') resetInspectPicker();
  if(id==='sec-myinspect') renderMyInspections();
  if(id==='sec-all') renderAllInspections();
}
function showSection(id){ document.querySelectorAll('.section').forEach(s=>s.classList.remove('active')); $(id)?.classList.add('active'); }

window.handleInspectFiles=function(files){
  Array.from(files).forEach(f=>{
    if(!f.type.startsWith('image/')){ notify('მხოლოდ სურათები!','error'); return; }
    if(f.size>10*1024*1024){ notify('ფოტო ძალიან დიდია (მაქს. 10MB)','error'); return; }
    inspectImgs.push({file:f,name:f.name,previewUrl:URL.createObjectURL(f)});
  });
  renderInspectPrev();
};

  const el=$('ins-prev'); if(!el) return;
  el.innerHTML=inspectImgs.map((im,i)=>`<div class="preview-item"><img src="${im.previewUrl}"><button class="del-img" onclick="rmInspectImg(${i})">✕</button></div>`).join('');

// ── SUBMIT ──
window.submitInspection = async function(){
  const obj=currentInspectObj; if(!obj){ notify('აირჩიეთ ობიექტი','error'); return; }
  const getR=n=>document.querySelector(`#inspect-form-host input[name="${n}"]:checked`)?.value||null;
  const gv=id=>{ const el=$(id); return el?el.value.trim():''; };
  const num=v=>v===''?null:Number(v);

  const filled=getR('water-filled');
  if(!filled){ notify('მიუთითეთ წყლის მდგომარეობა','error'); return; }
  const hotwater={ filled, temp:num(gv('water-temp')), pressure:num(gv('water-pressure')), comment:gv('water-comment') };

  let cooling=null;
  if(obj.type==='both'){
    const cs=getR('cool-status');
    if(!cs){ notify('მიუთითეთ გაგრილების სტატუსი','error'); return; }
    cooling={ status:cs, temp:num(gv('cool-temp')), pressure:num(gv('cool-pressure')), expander:gv('cool-expander'), comment:gv('cool-comment') };
  }

  const snap=await getDoc(doc(db,'users',currentUser.uid));
  const ud=snap.data();
  const now=new Date();
  const date=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const time=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  try{
    if(inspectImgs.length) notify('⏳ სურათები იტვირთება...','info');
    const imageUrls=[];
    for(const img of inspectImgs){
      const sref=ref(storage,`inspections/${currentUser.uid}/${Date.now()}_${img.name}`);
      await uploadBytes(sref,img.file);
      imageUrls.push({name:img.name,url:await getDownloadURL(sref)});
    }
    await addDoc(collection(db,'inspections'),{
      objectId:obj.id, objectName:obj.name, type:obj.type,
      cooling, hotwater, images:imageUrls,
      workerId:currentUser.uid, workerName:ud.displayName||ud.name, workerEmail:ud.email, workerRole:ud.role,
      date, time, submittedAt:serverTimestamp()
    });
    notify('✓ შემოწმება გაიგზავნა!','success');
    resetInspectPicker();
  }catch(ex){ notify('შეცდომა: '+ex.message,'error'); }
};

function listenMyInspections(){

    myInspections=all.filter(x=>x.workerId===currentUser.uid);
    populateInspectFilters(); renderObjGrid(); renderMyInspections();
  }, ()=>{});
}
function listenAllInspections(){
  const qy=query(collection(db,'inspections'),orderBy('submittedAt','desc'));
  onSnapshot(qy, snap=>{
    allInspections=snap.docs.map(d=>({id:d.id,...d.data()}));
    populateInspectFilters(); renderAllInspections();
  }, ()=>{});
}

}

function filteredAllInspections(){
  const of=$('aif-obj')?.value||'all', wf=$('aif-wk')?.value||'all', df=$('aif-date')?.value||'';

  if(of!=='all') list=list.filter(x=>x.objectId===of);
  if(wf!=='all') list=list.filter(x=>x.workerName===wf);
  if(df) list=list.filter(x=>x.date===df);

}
window.renderAllInspections=function(){

window.clearInspectFilter=function(){

// ── CARDS / BADGES ──
function insBadge(status){
  const m={
    'მუშაობს':['s-good','✅ მუშაობს'],'პრობლემა':['s-warn','⚠️ პრობლემა'],'არ მუშაობს':['s-bad','❌ არ მუშაობს'],
    'ჩართულია':['s-good','✅ ჩართულია'],'გათიშულია':['s-bad','❌ გათიშულია'],'წესრიგშია':['s-good','✅ წესრიგშია']
  };
  const [c,l]=m[status]||['', status||'—'];
  return `<span class="status ${c}">${l}</span>`;
}
function inspCard(ins,viewAs){
  const when=(ins.date||'')+(ins.time?' · '+ins.time:'');
  let badges='';
  if(ins.hotwater) badges+=`<span style="font-size:12px">💧</span>${insBadge(ins.hotwater.filled)}`;
  if(ins.cooling)  badges+=`<span style="font-size:12px">❄️</span>${insBadge(ins.cooling.status)}`;
  const delBtn=(viewAs==='admin')?`<button class="btn btn-sm" onclick="event.stopPropagation();delInspection('${ins.id}')" style="background:rgba(220,38,38,.1);color:#dc2626;border:1px solid rgba(220,38,38,.2);padding:4px 8px">🗑</button>`:'';
  return `<div class="card" style="cursor:pointer;padding:16px 18px" onclick="openInspectModal('${ins.id}')">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px">
      <div>
        <div style="font-size:15px;font-weight:800;letter-spacing:-.3px">${e(ins.objectName||'')}</div>
        <div style="font-size:12px;color:var(--text3);margin-top:3px">👤 ${e(ins.workerName||'')} · 📅 ${when}</div>
      </div>${delBtn}
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${badges}</div>
    ${ins.images?.length?`<div style="font-size:11px;color:var(--text3);margin-top:8px">📷 ${ins.images.length} ფოტო</div>`:''}
  </div>`;
}

window.openInspectModal=function(id){
  const ins=[...allInspections,...myInspections].find(x=>x.id===id); if(!ins) return;
  $('m-title').textContent=ins.objectName||'შემოწმება';
  let html=`<div class="detail-row"><span class="detail-label">👤 თანამშრომელი</span><span>${e(ins.workerName||'')}</span></div>
    <div class="detail-row"><span class="detail-label">📅 თარიღი / დრო</span><span>${ins.date||''}${ins.time?' · '+ins.time:''}</span></div>`;
  const sysHtml=(title,color,sys,isWater)=>{
    if(!sys) return '';
    let r=`<div style="height:1px;background:var(--border);margin:14px 0 10px"></div><div style="font-weight:800;color:${color};margin-bottom:8px">${title}</div>`;
    r+=`<div class="detail-row"><span class="detail-label">${isWater?'მდგომარეობა':'სტატუსი'}</span><span>${insBadge(isWater?sys.filled:sys.status)}</span></div>`;
    if(sys.temp!=null&&sys.temp!=='') r+=`<div class="detail-row"><span class="detail-label">🌡 ტემპერატურა</span><span>${e(sys.temp)} °C</span></div>`;
    if(sys.pressure!=null&&sys.pressure!=='') r+=`<div class="detail-row"><span class="detail-label">📊 წნევა</span><span>${e(sys.pressure)} bar</span></div>`;
    if(sys.expander) r+=`<div class="detail-row"><span class="detail-label">⚙️ გამაფართოებელი</span><span>${insBadge(sys.expander)}</span></div>`;
    if(sys.comment) r+=`<div class="comment-block">${e(sys.comment)}</div>`;
    return r;
  };
  html+=sysHtml('💧 ცხელი წყალი','var(--sky)',ins.hotwater,true);
  html+=sysHtml('❄️ გაგრილება / ჩილერი','var(--accent2)',ins.cooling,false);
  if(ins.images?.length) html+=`<div style="margin-top:14px"><div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:8px">📷 ფოტო მასალა (${ins.images.length})</div>
    <div class="preview-grid">${ins.images.map(im=>{const src=im.url||'';return `<div class="preview-item" style="cursor:pointer" onclick="window.open('${src}','_blank')"><img src="${src}" loading="lazy"></div>`;}).join('')}</div></div>`;
  $('m-body').innerHTML=html;
  let footer=`<button class="btn btn-ghost btn-sm" onclick="closeModal()">დახურვა</button>`;
  if(currentRole==='admin') footer+=`<span style="flex:1"></span><button class="btn btn-sm" onclick="closeModal();delInspection('${id}')" style="background:rgba(220,38,38,.1);color:#dc2626;border:1px solid rgba(220,38,38,.2)">🗑 წაშლა</button>`;
  $('m-footer').innerHTML=footer;
  $('modal-ov').classList.add('open');
};
window.closeModal=function(){ $('modal-ov').classList.remove('open'); };
$('modal-ov').addEventListener('click',ev=>{ if(ev.target===ev.currentTarget) window.closeModal(); });

window.delInspection=async function(id){
  if(!confirm('წავშალო ეს შემოწმება?')) return;
  try{ await deleteDoc(doc(db,'inspections',id)); notify('✓ წაიშალა','success'); }
  catch(ex){ notify('შეცდომა: '+ex.message,'error'); }
};

// ── CSV EXPORT ──
window.exportInspectCSV=function(){
  const list=filteredAllInspections();
  if(!list.length){ notify('სია ცარიელია','error'); return; }
  const hdr=['#','ობიექტი','თანამშრომელი','ელ-ფოსტა','თარიღი','დრო',
    'წყალი-მდგომარეობა','წყალი-ტემპ(°C)','წყალი-წნევა(bar)','წყალი-კომენტარი',
    'გაგრილება-სტატუსი','გაგრილება-ტემპ(°C)','გაგრილება-წნევა(bar)','გაგრილება-გამაფართოებელი','გაგრილება-კომენტარი'];
  const rows=list.map((x,i)=>{
    const w=x.hotwater||{}, c=x.cooling||{};
    return [i+1,x.objectName||'',x.workerName||'',x.workerEmail||'',x.date||'',x.time||'',
      w.filled||'',w.temp??'',w.pressure??'',w.comment||'',
      c.status||'',c.temp??'',c.pressure??'',c.expander||'',c.comment||''];
  });
  const csv=[hdr,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`shemowmebebi_${new Date().toISOString().slice(0,10)}.csv`; a.click();
  URL.revokeObjectURL(url);
  notify('✓ ჩამოიტვირთა!','success');
};
</script>
